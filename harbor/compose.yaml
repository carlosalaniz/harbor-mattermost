# Mattermost Team Edition as a Harbor app. Service names match the original Compose stack
# (`mattermost`, `mattermost-db`), so a copied config.json and database keep working.
#
# The image has no shell, so the database URL carries no password: Mattermost's Postgres driver
# (lib/pq) takes it from PGPASSWORD, which Harbor fills with its generated `db-password`. No secret
# lives in this file. Role and database are both `mattermost`; a database copied from another
# machine is renamed to match (see README) or these literals are changed together.
#
# File storage is local (/mattermost/data, the `data` volume). The environment overrides
# whatever config.json says (e.g. an old amazons3/MinIO setting); the System Console then shows
# these settings as read-only.
services:
  mattermost:
    image: mattermost/mattermost-team-edition@sha256:d2b313cf97c643ca40fd6a2a381006617ec0c6c1a0b1999bedfd1b9f887b5062
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_ALLOWCORSFROM: "*"
      MM_FILESETTINGS_DRIVERNAME: local
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      MM_LOGSETTINGS_ENABLEFILE: "false"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
    depends_on:
      mattermost-db: {condition: service_healthy}
    volumes:
      - {type: volume, source: config, target: /mattermost/config}
      - {type: volume, source: data, target: /mattermost/data}
      - {type: volume, source: logs, target: /mattermost/logs}
      - {type: volume, source: plugins, target: /mattermost/plugins}
      - {type: volume, source: client-plugins, target: /mattermost/client/plugins}
      - {type: volume, source: bleve, target: /mattermost/bleve-indexes}

  mattermost-db:
    image: pgvector/pgvector@sha256:7f5681e45237acdf546cf7cdc0dfc0ed7752ede857fda6e54f6ea21b936f8742
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_DB: mattermost
    healthcheck:
      test: [CMD, pg_isready, -U, mattermost, -d, mattermost]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: /var/lib/postgresql/data}

volumes:
  db: {}
  config: {}
  data: {}
  logs: {}
  plugins: {}
  client-plugins: {}
  bleve: {}
